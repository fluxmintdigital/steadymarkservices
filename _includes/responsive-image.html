{% assign media = site.data.media | where: 'id', include.media_id | first %}<img class="responsive-image {{ include.class }}" src="{{ include.src | default: media.src | relative_url }}" alt="{{ include.alt }}" loading="{{ include.loading | default: 'lazy' }}" width="{{ include.width }}" height="{{ include.height }}" style="--focal-desktop: {{ media.focal.desktop }}; --focal-mobile: {{ media.focal.mobile }};" data-media-id="{{ include.media_id }}">
