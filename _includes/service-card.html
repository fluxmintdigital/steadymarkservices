<article class="service-card">
  <div class="service-card-image"><img src="{{ include.service.image | relative_url }}" alt="{{ include.service.name }} representative property context" loading="lazy" width="1200" height="850"></div>
  <div class="service-card-content"><span class="eyebrow">{{ include.service.eyebrow }}</span><h3>{{ include.service.name }}</h3><p>{{ include.service.recognition }}</p><a class="text-link" href="{{ include.service.route | relative_url }}">Explore {{ include.service.name }} <span aria-hidden="true">↗</span></a></div>
</article>
